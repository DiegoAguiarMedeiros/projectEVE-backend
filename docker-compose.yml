services:
  app:
    build: .
    ports:
      - "${PORT}:${PORT}"
    networks:
      - backend-network
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      PROJECT_EVE_IS_PRODUCTION: ${PROJECT_EVE_IS_PRODUCTION}
      PROJECT_EVE_APP_SECRET: ${PROJECT_EVE_APP_SECRET}
      PROJECT_EVE_REDIS_URL: ${PROJECT_EVE_REDIS_URL}
      PROJECT_EVE_REDIS_PORT: ${PROJECT_EVE_REDIS_PORT}
      PROJECT_EVE_DB_USER: ${PROJECT_EVE_DB_USER}
      PROJECT_EVE_DB_PASS: ${PROJECT_EVE_DB_PASS}
      PROJECT_EVE_DB_HOST: ${PROJECT_EVE_DB_HOST}
      PROJECT_EVE_DB_NAME: ${PROJECT_EVE_DB_NAME}
      PROJECT_EVE_DB_PORT: ${PROJECT_EVE_DB_PORT}

  postgres:
    image: postgres:15
    ports:
      - "${PROJECT_EVE_DB_PORT}:${PROJECT_EVE_DB_PORT}"
    environment:
      POSTGRES_USER: ${PROJECT_EVE_DB_USER}
      POSTGRES_PASSWORD: ${PROJECT_EVE_DB_PASS}
      POSTGRES_DB: ${PROJECT_EVE_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  redis:
    image: redis:latest
    sysctls:
      - vm.overcommit_memory=1
    ports:
      - "${PROJECT_EVE_REDIS_PORT}:${PROJECT_EVE_REDIS_PORT}"
    networks:
      - backend-network

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge
